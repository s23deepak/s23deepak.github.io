<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — ML / AI Systems Engineer{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    
    <!-- Preconnect & Google Fonts: Newsreader (Editorial Serif) & JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #faf8f5;
            --bg-surface: #ffffff;
            --bg-subtle: #f2eee6;
            --bg-code-inline: #f0ece3;
            --border-subtle: #e5dfd5;
            --border-strong: #d0c8bb;
            --text-primary: #1c1d1f;
            --text-secondary: #5a5f67;
            --text-muted: #7e8490;
            --accent: #1e40af;
            --accent-hover: #1d4ed8;
            --accent-subtle: #eff6ff;
            --tag-bg: #eae4d8;
            --tag-text: #4a505b;
            --code-block-bg: #0f141c;
            --code-block-border: #1f2733;
            --content-width: 920px;
            --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-canvas: #121418;
                --bg-surface: #181b22;
                --bg-subtle: #1f242e;
                --bg-code-inline: #202530;
                --border-subtle: #292f3d;
                --border-strong: #384256;
                --text-primary: #edf1f7;
                --text-secondary: #a2abb9;
                --text-muted: #717b8c;
                --accent: #60a5fa;
                --accent-hover: #93c5fd;
                --accent-subtle: #172554;
                --tag-bg: #222838;
                --tag-text: #9aa4b5;
                --code-block-bg: #0b0d12;
                --code-block-border: #222836;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 17px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-sans);
            line-height: 1.75;
            margin: 0;
            padding: 0;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Top Navigation Header */
        header.site-header {
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-canvas);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(250, 248, 245, 0.88);
        }

        @media (prefers-color-scheme: dark) {
            header.site-header {
                background-color: rgba(18, 20, 24, 0.88);
            }
        }

        .header-inner {
            max-width: var(--content-width);
            margin: 0 auto;
            padding: 1.15rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand-link {
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.76rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.02em;
            margin-top: 0.2rem;
        }

        nav.site-nav {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        nav.site-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        nav.site-nav a:hover {
            color: var(--accent);
        }

        /* Main Content Container */
        main.site-main {
            max-width: var(--content-width);
            margin: 2.75rem auto 4.5rem auto;
            padding: 0 1.25rem;
        }

        /* Typography & Headings */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            font-family: var(--font-serif);
            font-weight: 600;
            line-height: 1.28;
            margin-top: 2.25rem;
            margin-bottom: 0.85rem;
            letter-spacing: -0.015em;
        }

        h1 { font-size: 2.25rem; margin-top: 0; }
        h2 { font-size: 1.65rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.35rem; }
        h3 { font-size: 1.3rem; }
        h4 { font-size: 1.1rem; font-family: var(--font-sans); font-weight: 600; }

        p {
            margin: 1.2rem 0;
            color: var(--text-primary);
        }

        a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: color 0.15s ease, text-decoration-color 0.15s ease;
        }

        a:hover {
            color: var(--accent-hover);
            text-decoration-thickness: 2px;
        }

        /* Hero / Introduction on Homepage */
        .hero-section {
            margin-bottom: 2.75rem;
            padding-bottom: 2.25rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .hero-lead {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-top: 0.6rem;
        }

        .hero-bio {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.75;
            margin-top: 1rem;
        }

        /* Post Lists on Homepage */
        .section-heading {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-heading::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .post-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .post-card {
            display: block;
            text-decoration: none;
            padding: 1.35rem 1.45rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .post-card:hover {
            border-color: var(--border-strong);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }

        .post-meta-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .post-card-title {
            font-family: var(--font-serif);
            font-size: 1.28rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
            line-height: 1.35;
        }

        .post-card:hover .post-card-title {
            color: var(--accent);
        }

        .post-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.65rem;
        }

        .post-tag {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 0.15rem 0.5rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 4px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Post Layout Elements */
        .post-header {
            margin-bottom: 2.25rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .back-nav {
            margin-bottom: 1.25rem;
        }

        .back-nav a {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .back-nav a:hover {
            color: var(--accent);
        }

        .post-title {
            font-size: 2.35rem;
            line-height: 1.22;
            margin: 0 0 0.85rem 0;
        }

        .post-meta {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        /* Inline Code & Code Blocks */
        code {
            font-family: var(--font-mono);
            font-size: 0.88em;
            background-color: var(--bg-code-inline);
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border: none;
            color: inherit;
        }

        .highlight {
            background: var(--code-block-bg);
            border: 1px solid var(--code-block-border);
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
            overflow-x: auto;
            margin: 1.6rem 0;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        .highlight pre {
            margin: 0;
            white-space: pre;
            word-break: normal;
        }

        /* Rouge Syntax Highlighting */
        .k, .kd, .kr { color: #f472b6; font-weight: 500; }
        .kn, .kp { color: #fb7185; }
        .n { color: #e5e7eb; }
        .na { color: #fbbf24; }
        .nb { color: #38bdf8; }
        .nc { color: #67e8f9; font-weight: 500; }
        .nf, .fm { color: #93c5fd; }
        .nt { color: #f472b6; }
        .nv, .vc, .vg, .vi { color: #a7f3d0; }
        .o, .ow { color: #cbd5e1; }
        .p { color: #9ca3af; }
        .m, .mi, .mf, .mh, .il { color: #fde047; }
        .s, .sa, .sb, .sc, .dl, .sd, .s2, .se, .sh, .si, .sx, .sr, .s1, .ss { color: #86efac; }
        .c, .ch, .cm, .cp, .cpf, .c1, .cs { color: #6b7280; font-style: italic; }

        /* Blockquotes */
        blockquote {
            border-left: 3px solid var(--border-strong);
            margin: 1.5rem 0;
            padding: 0.5rem 0 0.5rem 1.25rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        blockquote p {
            margin: 0.5rem 0;
        }

        /* Lists */
        ul, ol {
            padding-left: 1.4rem;
            margin: 1rem 0;
        }

        li {
            margin-bottom: 0.45rem;
        }

        /* Figures & Images */
        figure {
            margin: 2.25rem 0;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
        }

        figcaption {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.65rem;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.92rem;
        }

        th, td {
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--border-subtle);
            text-align: left;
        }

        th {
            background-color: var(--bg-subtle);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.015);
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-subtle);
            margin: 2.5rem 0;
        }

        /* Prevent duplicate H1 in post content if author also wrote `# Title` */
        .post-body > h1:first-child {
            display: none;
        }

        .post-body p {
            text-align: left;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
        }

        /* Site Footer */
        footer.site-footer {
            border-top: 1px solid var(--border-subtle);
            padding: 2.25rem 1.25rem;
            background: var(--bg-canvas);
        }

        .footer-inner {
            max-width: var(--content-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 1.25rem;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand-link">
                <span class="brand-title">{{ site.title }}</span>
                <span class="brand-subtitle">ML &amp; AI Systems</span>
            </a>
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="https://github.com/s23deepak" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/deepak-swaminathan-90a707153/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="/feed.xml" title="RSS Feed">RSS</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</div>
            <div class="footer-links">
                <a href="https://github.com/s23deepak" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/deepak-swaminathan-90a707153/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="mailto:23.deepak.s@gmail.com">Contact</a>
                <a href="/feed.xml">RSS</a>
            </div>
        </div>
    </footer>
</body>
</html>
